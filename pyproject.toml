[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "se-mvp"
version = "0.100.0"
description = "Reference implementation for nested-subject existence evolution simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
se = "se.cmd.run:main"
se-multi = "se.cmd.multi_seed:main"
se-gui = "se.gui.runner:main"
se-d1-factorial = "se.experiments.d1_factorial:main"
se-d1-resource-sensing-plan = "se.experiments.d1_resource_sensing:plan_main"
se-d1-resource-sensing = "se.experiments.d1_resource_sensing:run_main"
se-d1-resource-conversion-plan = "se.experiments.d1_resource_conversion:plan_main"
se-d1-resource-conversion = "se.experiments.d1_resource_conversion:run_main"
se-d1-resource-storage-plan = "se.experiments.d1_resource_storage:plan_main"
se-d1-resource-storage = "se.experiments.d1_resource_storage:run_main"
se-d1-resource-recycling-plan = "se.experiments.d1_resource_recycling:plan_main"
se-d1-resource-recycling = "se.experiments.d1_resource_recycling:run_main"
se-d1-reproduction-investment-plan = "se.experiments.d1_reproduction_investment:plan_main"
se-d1-reproduction-investment = "se.experiments.d1_reproduction_investment:run_main"
se-d2-audit = "se.experiments.d2_module_audit:main"
se-d2-assess = "se.analysis.d2_effects:main"
se-d2-lineage-pairs = "se.experiments.d2_lineage_pairs:main"
se-d2-lineage-assess = "se.analysis.d2_lineage_effects:main"
se-d2-lineage-mediate = "se.experiments.d2_lineage_mediation:main"
se-d2-lineage-mediate-assess = "se.analysis.d2_lineage_mediation_effects:main"
se-d2-source-population = "se.experiments.d2_source_population:main"
se-d2-source-population-assess = "se.analysis.d2_source_population_effects:main"
se-d2-source-causal = "se.experiments.d2_source_population_causal:main"
se-d2-source-causal-assess = "se.analysis.d2_source_population_causal_effects:main"
se-d2-compose = "se.experiments.d2_compositional_capability:main"
se-d2-embody = "se.experiments.d2_embodied_capability:main"
se-d2-physiology = "se.experiments.d2_physiological_ecology:main"
se-d2-regulatory-physiology = "se.experiments.d2_regulatory_physiology:main"
se-d2-regulatory-physiology-assess = "se.analysis.d2_regulatory_physiology_flows:main"
se-d3-resource-metabolism = "se.experiments.d3_resource_metabolism:main"
se-d3-conservative-intake = "se.experiments.d3_conservative_intake:main"
se-d3-conservative-intake-assess = "se.analysis.d3_conservative_intake_effects:main"
se-d3-external-recycling = "se.experiments.d3_external_recycling:main"
se-d3-resource-renewal = "se.experiments.d3_persistent_resource_renewal:main"
se-d3-spatial-processing = "se.experiments.d3_spatial_processing:main"
se-d3-processing-response = "se.experiments.d3_processing_response:main"
se-d3-processing-response-panel = "se.experiments.d3_processing_response_panel:main"
se-d3-response-adequacy = "se.analysis.d3_response_adequacy:main"
se-d3-response-scale-audit = "se.analysis.d3_response_scale_audit:main"
se-gpu-execution-audit = "se.analysis.gpu_execution_audit:main"
se-gpu-memory-audit = "se.analysis.gpu_memory_stability:main"
se-selection-validity-audit = "se.analysis.selection_validity:main"
se-exploration-readiness = "se.analysis.exploration_readiness:main"
se-exploration-plan = "se.analysis.exploration_protocol:main"
se-exploration-paired-plan = "se.experiments.paired_exploration:plan_main"
se-exploration-paired = "se.experiments.paired_exploration:run_main"
se-exploration-candidate-record = "se.analysis.candidate_ledger:main"
se-exploration-ledger-hydrate = "se.analysis.candidate_ledger:hydrate_main"
se-exploration-portfolio-audit = "se.analysis.exploration_portfolio:main"
se-study-freeze = "se.analysis.study_bundle:freeze_main"
se-study-result-import = "se.analysis.study_bundle:import_main"
se-study-result-export = "se.analysis.study_bundle:export_main"
se-study-freeze-legacy = "se.analysis.study_bundle:freeze_legacy_main"
se-study-layout-migrate = "se.analysis.study_bundle:layout_migrate_main"
se-study-runtime-migrate = "se.analysis.study_bundle:migrate_main"
se-study-verify = "se.analysis.study_bundle:verify_main"
se-study = "se.cmd.study:main"
se-source-health-gate = "se.analysis.source_health:main"
se-turnover-substrate-config = "se.experiments.d1_turnover_substrate:main"
se-capability-budget = "se.analysis.capability_budget:main"
se-capability-source-config = "se.experiments.d1_capability_attachment:main"
se-integrated-baseline = "se.analysis.integrated_baseline:main"
se-gene-persistence = "se.analysis.gene_persistence:main"
se-integrated-retention-audit = "se.analysis.integrated_retention_audit:main"
se-equilibrium-source-config = "se.experiments.d1_equilibrium_flux:main"
se-equilibrium-audit = "se.analysis.equilibrium_audit:main"
se-structured-environment-config = "se.experiments.d1_structured_environment:main"
se-environment-structure-summary = "se.analysis.environment_structure:main"
se-d4-niche-reversal = "se.experiments.d4_niche_reversal:main"
se-d4-niche-assess = "se.analysis.d4_niche_reversal_effects:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
se = ["resources/*.json"]
