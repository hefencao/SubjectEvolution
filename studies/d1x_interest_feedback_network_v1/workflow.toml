schema = "se-study-workflow-v1"
study_id = "d1x_interest_feedback_network_v1"
title = "D1-X delayed material-interest relationship network"

[parameters.probe_seed]
type = "int"
default = 105011
description = "Single relation-semantics debug seed; never Epoch 1 evidence."

[parameters.template]
type = "path"
default = "studies/d1x_interest_feedback_network_v1/frozen/d1v/source_config.json"
description = "Frozen D1-V independent-medium configuration."

[parameters.generated_config]
type = "path"
default = "state/studies/d1x_interest_feedback_network_v1/interest_feedback.json"
description = "Generated D1-X relation configuration."

[parameters.runtime_root]
type = "path"
default = "runs/base/d1x_interest_feedback_network_v1/probe"
description = "Single debug runtime root."

[parameters.analysis_root]
type = "path"
default = "analyses/d1x_interest_feedback_network_v1"
description = "D1-X debug analysis root."

[parameters.output]
type = "result-path"
default = "d1x_interest_feedback_network_v1_debug_results.zip"
description = "External debug result bundle."

[parameters.include_checkpoints]
type = "bool"
default = false
description = "Include checkpoints only for explicit replay."

[steps.evidence-audit]
description = "Verify the frozen D1-V source and transport manifest."
command = ["python", "scripts/verify_frozen_files.py", "--lock", "{study_dir}/frozen/EVIDENCE_LOCK.json", "--output", "{analysis_root}/evidence_audit.json"]

[steps.prepare-config]
description = "Replace fixed SHARE trust increments with delayed realized material balance."
command = ["se-interest-feedback-config", "--template", "{template}", "--output", "{generated_config}", "--ticks", "720", "--window-ticks", "120", "--learning-rate", "0.08", "--minimum-material", "0.5"]
requires_json = [{ path = "{analysis_root}/evidence_audit.json", field = "passed", equals = true }]

[steps.relation-probe]
description = "Run one CPU relation-semantics probe; not an Epoch 1 qualification."
command = ["se-multi", "--config", "{generated_config}", "--seeds", "{probe_seed}", "--output", "{runtime_root}", "--backend", "cpu", "--until-tick", "720", "--no-checkpoints", "--skip-post-run-audits"]
requires_json = [
  { path = "{generated_config}.manifest.json", field = "authorization.epoch_1_entry", equals = false },
  { path = "{generated_config}.manifest.json", field = "fixed_share_trust_enabled", equals = false },
]

[steps.relation-summary]
description = "Verify delayed material settlement and retain the Epoch 1 evidence boundary."
command = ["se-interest-feedback-debug", "--source-root", "{runtime_root}", "--output", "{analysis_root}/interest_feedback.json"]

[steps.pack-results]
description = "Package frozen source, generated config, runtime and debug summary externally."
requires_json = [{ path = "{analysis_root}/interest_feedback.json", field = "semantics_ready", equals = true }]
command = ["python", "scripts/package_required_results.py", "--study-root", "{study_dir}", "--analysis-root", "{analysis_root}", "--runtime-root", "{runtime_root}", "--required-file", "{generated_config}", "--required-file", "{generated_config}.manifest.json", "--output", "{output}"]
boolean_flags = { include_checkpoints = "--include-checkpoints" }
