schema = "se-study-workflow-v1"
study_id = "d1l_turnover_substrate_v1"
title = "D1-L healthy generational-turnover substrate qualification"

[parameters.backend]
type = "choice"
default = "auto"
choices = ["auto", "cpu", "gpu"]
description = "Execution backend."

[parameters.seeds]
type = "csv-int"
default = "91001,91002,91003"
description = "Independent qualification seeds."

[parameters.initial_entities]
type = "int"
default = 160
minimum = 16
description = "Initial population; part of substrate calibration, not a replicate count."

[parameters.initial_energy]
type = "float"
default = 2.4
minimum = 0.0
description = "Initial body energy."

[parameters.maintenance_cost]
type = "float"
default = 0.015
minimum = 0.0
description = "Base body maintenance cost per tick."

[parameters.harvest_multiplier]
type = "float"
default = 1.0
minimum = 0.0
description = "Uniform ecological throughput multiplier for all four resource channels."

[parameters.resource_regeneration]
type = "float"
default = 0.018
minimum = 0.0
description = "Uniform per-channel resource regeneration."

[parameters.reproduction_threshold]
type = "float"
default = 2.0
minimum = 0.0
description = "Fixed substrate reproduction eligibility threshold."

[parameters.reproduction_cost]
type = "float"
default = 0.6
minimum = 0.0
description = "Fixed substrate reproduction cost."

[parameters.target_tick]
type = "int"
default = 240
minimum = 240
description = "Short qualification horizon; longer runs are unauthorized until this gate passes."

[parameters.generated_config]
type = "path"
default = "state/studies/d1l_turnover_substrate_v1/source_config.json"
description = "Generated local substrate config."

[parameters.source_root]
type = "path"
default = "runs/base/d1l_turnover_substrate_v1/qualification"
description = "Health-gated source output root."

[parameters.analysis_root]
type = "path"
default = "analyses/d1l_turnover_substrate_v1/qualification"
description = "Health gate report root."

[parameters.output]
type = "result-path"
default = "d1l_turnover_substrate_v1_results.zip"
description = "External result bundle."

[parameters.include_checkpoints]
type = "bool"
default = false
description = "Include checkpoints for exact replay."

[steps.prepare-config]
description = "Generate an explicit substrate-only config; no new inherited capability is added."
command = ["se-turnover-substrate-config", "--template", "{study_dir}/protocol/source_template.json", "--output", "{generated_config}", "--initial-entities", "{initial_entities}", "--initial-energy", "{initial_energy}", "--maintenance-cost", "{maintenance_cost}", "--harvest-multiplier", "{harvest_multiplier}", "--resource-regeneration", "{resource_regeneration}", "--reproduction-threshold", "{reproduction_threshold}", "--reproduction-cost", "{reproduction_cost}", "--target-tick", "{target_tick}"]

[steps.source-pilot]
description = "Run the short panel with staged early-stop health checks."
command = ["se-multi", "--config", "{generated_config}", "--seeds", "{seeds}", "--output", "{source_root}", "--backend", "{backend}", "--until-tick", "{target_tick}", "--checkpoint-ticks", "{target_tick}", "--source-health-contract", "{study_dir}/protocol/source_health.json", "--skip-post-run-audits"]
requires_json = [{ path = "{generated_config}.manifest.json", field = "schema", equals = "d1-turnover-substrate-config-v1" }]

[steps.source-health]
description = "Re-evaluate the source panel as an execution precondition, not a scientific effect audit."
command = ["se-source-health-gate", "--source-root", "{source_root}", "--contract", "{study_dir}/protocol/source_health.json", "--output", "{analysis_root}/source_health_gate.json"]

[steps.pack-results]
description = "Package the qualification evidence in the configured external directory."
command = ["python", "scripts/package_required_results.py", "--study-root", "{study_dir}", "--analysis-root", "analyses/d1l_turnover_substrate_v1", "--runtime-root", "runs/base/d1l_turnover_substrate_v1", "--required-file", "{generated_config}", "--required-file", "{generated_config}.manifest.json", "--output", "{output}"]
boolean_flags = { include_checkpoints = "--include-checkpoints" }
