schema = "se-study-workflow-v1"
study_id = "d1z_subject_vm_stage3c13_exposure_adequacy_v1"
title = "D1-Z Subject VM Stage 3C-13 temporary parameter exposure adequacy audit"

[parameters.config]
type = "path"
default = "configs/mvp_short_subject_vm_stage3c8_paired_study.json"
description = "Unchanged fixed-bootstrap paired source configuration."

[parameters.seeds]
type = "csv-int"
default = "12301,12302,12303,12304,12305,12306,12307,12308,12309"
description = "The frozen nine independent-source panel."

[parameters.source_ticks]
type = "int"
default = 2
minimum = 0
maximum = 16
description = "Unchanged source checkpoint tick."

[parameters.horizon_ticks]
type = "int"
default = 8
minimum = 4
maximum = 8
description = "Unchanged trace-safe branch horizon."

[parameters.bootstrap_subjects]
type = "int"
default = 16
minimum = 1
maximum = 64
description = "Unchanged fixed-bootstrap stable-subject count."

[parameters.analysis_root]
type = "path"
default = "analyses/d1z_subject_vm_stage3c13_exposure_adequacy_v1/pilot"
description = "Separate exposure-two and exposure-three arms plus Stage-3C-13 comparison."

[parameters.output]
type = "result-path"
default = "d1z_subject_vm_stage3c13_exposure_adequacy_v1_results.zip"
description = "Compact study result bundle, separate from the project release archive."

[steps.run-baseline-exposure-two]
description = "Run the nine-source eight-tick arm with rollback/control exposure duration two."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "{source_ticks}", "--horizon-ticks", "{horizon_ticks}", "--bootstrap-subjects", "{bootstrap_subjects}", "--rollback-after-ticks", "2", "--backend", "cpu", "--output", "{analysis_root}/exposure_2", "--overwrite"]

[steps.run-extended-exposure-three]
description = "Run the identical source panel with rollback/control exposure duration three."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "{source_ticks}", "--horizon-ticks", "{horizon_ticks}", "--bootstrap-subjects", "{bootstrap_subjects}", "--rollback-after-ticks", "3", "--backend", "cpu", "--output", "{analysis_root}/exposure_3", "--overwrite"]

[steps.assess-exposure-adequacy]
description = "Verify exposure-only plan overrides, identical sources and read-only control behavior before comparison."
command = ["se-subject-vm-stage3c13-exposure-adequacy", "--baseline-study-report", "{analysis_root}/exposure_2/study_report.json", "--extended-study-report", "{analysis_root}/exposure_3/study_report.json", "--output", "{analysis_root}/stage3c13_exposure_adequacy.json"]

[steps.pack-results]
description = "Package both score-free evidence arms and the Stage-3C-13 assessment."
requires_json = [
  { path = "{analysis_root}/exposure_2/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/exposure_3/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/stage3c13_exposure_adequacy.json", field = "source_panel_and_contract_integrity.read_only_control_behavior_equal", equals = true },
  { path = "{analysis_root}/stage3c13_exposure_adequacy.json", field = "permanent_parameter_retention_authorized", equals = false },
]
command = ["python", "scripts/package_required_results.py", "--study-root", "{study_dir}", "--analysis-root", "{analysis_root}", "--required-file", "{analysis_root}/exposure_2/study_report.json", "--required-file", "{analysis_root}/exposure_2/paired_evidence_assessment.json", "--required-file", "{analysis_root}/exposure_2/component_reproducibility.json", "--required-file", "{analysis_root}/exposure_2/stage3c10_diagnostics.json", "--required-file", "{analysis_root}/exposure_3/study_report.json", "--required-file", "{analysis_root}/exposure_3/paired_evidence_assessment.json", "--required-file", "{analysis_root}/exposure_3/component_reproducibility.json", "--required-file", "{analysis_root}/exposure_3/stage3c10_diagnostics.json", "--required-file", "{analysis_root}/stage3c13_exposure_adequacy.json", "--output", "{output}"]
