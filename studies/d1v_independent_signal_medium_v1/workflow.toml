schema = "se-study-workflow-v1"
study_id = "d1v_independent_signal_medium_v1"
title = "D1-V independent signal medium and direct-conflict boundary"

[parameters.probe_seed]
type = "int"
default = 103011
description = "Transport-semantics debug seed; never formal evidence."

[parameters.template]
type = "path"
default = "studies/d1v_independent_signal_medium_v1/frozen/d1u/source_config.json"
description = "Frozen D1-U resolved configuration."

[parameters.generated_config]
type = "path"
default = "state/studies/d1v_independent_signal_medium_v1/independent_signal_medium.json"
description = "Generated D1-V transport configuration."

[parameters.runtime_root]
type = "path"
default = "runs/base/d1v_independent_signal_medium_v1/probe"
description = "Single debug runtime root."

[parameters.analysis_root]
type = "path"
default = "analyses/d1v_independent_signal_medium_v1"
description = "D1-V debug analysis root."

[parameters.output]
type = "result-path"
default = "d1v_independent_signal_medium_v1_debug_results.zip"
description = "External debug evidence bundle."

[parameters.include_checkpoints]
type = "bool"
default = false
description = "Include checkpoints only for explicit replay."

[steps.evidence-audit]
description = "Verify frozen D1-U CPU/GPU semantic evidence and source config."
command = ["python", "scripts/verify_frozen_files.py", "--lock", "{study_dir}/frozen/EVIDENCE_LOCK.json", "--output", "{analysis_root}/evidence_audit.json"]

[steps.prepare-config]
description = "Separate movement resistance from signal openness without changing genes, movement, resources, or conflict."
command = ["se-independent-signal-medium-config", "--template", "{template}", "--output", "{generated_config}", "--ticks", "240", "--conductance-fraction", "0.65", "--openness-floor", "0.25", "--openness-amplitude", "0.75", "--medium-resistance", "0.55", "--distance-decay", "0.025"]
requires_json = [{ path = "{analysis_root}/evidence_audit.json", field = "passed", equals = true }]

[steps.transport-probe]
description = "Run one CPU transport-semantics probe; not an environment or social-structure qualification."
command = ["se-multi", "--config", "{generated_config}", "--seeds", "{probe_seed}", "--output", "{runtime_root}", "--backend", "cpu", "--until-tick", "240", "--no-checkpoints", "--skip-post-run-audits"]
requires_json = [
  { path = "{generated_config}.manifest.json", field = "output_file_sha256", equals = "8e204f96342723a262ddb26b057e4a55eeb280a593a24d04b80d8849e81500c0" },
  { path = "{generated_config}.manifest.json", field = "authorization.direct_conflict_implementation", equals = false },
]

[steps.transport-summary]
description = "Verify independent movement and signal fields in the actual run."
command = ["se-signal-medium-debug", "--source-root", "{runtime_root}", "--output", "{analysis_root}/transport_probe.json"]

[steps.pack-results]
description = "Package frozen evidence, actual config, runtime summary and transport analysis externally."
requires_json = [{ path = "{analysis_root}/transport_probe.json", field = "semantics_ready", equals = true }]
command = ["python", "scripts/package_required_results.py", "--study-root", "{study_dir}", "--analysis-root", "{analysis_root}", "--runtime-root", "{runtime_root}", "--required-file", "{generated_config}", "--required-file", "{generated_config}.manifest.json", "--output", "{output}"]
boolean_flags = { include_checkpoints = "--include-checkpoints" }
