schema = "se-study-workflow-v1"
study_id = "d1z_subject_vm_stage3c18_bounded_candidate_allocation_v1"
title = "D1-Z Subject VM Stage 3C-18 bounded candidate allocation audit"

[parameters.config]
type = "path"
default = "configs/mvp_short_subject_vm_stage3c8_paired_study.json"
description = "Unchanged fixed-bootstrap paired source configuration."

[parameters.seeds]
type = "csv-int"
default = "12301,12302,12303,12304,12305,12306,12307,12308,12309"
description = "Frozen nine independent-source panel."

[parameters.analysis_root]
type = "path"
default = "analyses/d1z_subject_vm_stage3c18_bounded_candidate_allocation_v1/final"
description = "Top-1/top-2 arms plus Stage-3C-18 assessment."

[parameters.output]
type = "result-path"
default = "d1z_subject_vm_stage3c18_bounded_candidate_allocation_v1_results.zip"
description = "Compact research result bundle separate from the project archive."

[steps.run-top1]
description = "Run the frozen reachable baseline with one latest-ranked association reference."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "2", "--horizon-ticks", "8", "--bootstrap-subjects", "16", "--rollback-after-ticks", "3", "--bootstrap-target-family", "edge_forward_gate", "--bootstrap-edge-carrier-enabled", "--association-tie-break", "latest", "--association-candidate-limit", "1", "--backend", "cpu", "--output", "{analysis_root}/top1", "--overwrite"]

[steps.run-top2]
description = "Run the same panel with only the bounded association candidate limit raised to two."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "2", "--horizon-ticks", "8", "--bootstrap-subjects", "16", "--rollback-after-ticks", "3", "--bootstrap-target-family", "edge_forward_gate", "--bootstrap-edge-carrier-enabled", "--association-tie-break", "latest", "--association-candidate-limit", "2", "--backend", "cpu", "--output", "{analysis_root}/top2", "--overwrite"]

[steps.assess-bounded-candidates]
description = "Verify source identity and audit the isolated one-versus-two candidate allocation."
command = ["se-subject-vm-stage3c18-bounded-candidate-allocation", "--top1-study-report", "{analysis_root}/top1/study_report.json", "--top2-study-report", "{analysis_root}/top2/study_report.json", "--output", "{analysis_root}/stage3c18_bounded_candidate_allocation.json"]

[steps.pack-results]
description = "Package both paired evidence arms and the Stage-3C-18 assessment without checkpoints."
requires_json = [
  { path = "{analysis_root}/top1/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/top2/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/stage3c18_bounded_candidate_allocation.json", field = "isolation_contract.only_candidate_limit_changed", equals = true },
  { path = "{analysis_root}/stage3c18_bounded_candidate_allocation.json", field = "diagnostic_interpretation.bounded_top2_increases_addressed_historical_reference_count", equals = true },
  { path = "{analysis_root}/stage3c18_bounded_candidate_allocation.json", field = "permanent_parameter_retention_authorized", equals = false },
]
command = ["python", "scripts/package_required_results.py", "--study-root", "{study_dir}", "--required-file", "{analysis_root}/top1/study_report.json", "--required-file", "{analysis_root}/top1/bootstrap_profile.json", "--required-file", "{analysis_root}/top1/paired_evidence_assessment.json", "--required-file", "{analysis_root}/top1/component_reproducibility.json", "--required-file", "{analysis_root}/top1/stage3c10_diagnostics.json", "--required-file", "{analysis_root}/top2/study_report.json", "--required-file", "{analysis_root}/top2/bootstrap_profile.json", "--required-file", "{analysis_root}/top2/paired_evidence_assessment.json", "--required-file", "{analysis_root}/top2/component_reproducibility.json", "--required-file", "{analysis_root}/top2/stage3c10_diagnostics.json", "--required-file", "{analysis_root}/stage3c18_bounded_candidate_allocation.json", "--output", "{output}"]
