schema = "se-study-workflow-v1"
study_id = "d1z_subject_vm_stage3c31_alignment_ablation_v1"
title = "D1-Z Subject VM Stage 3C-31 subject-time alignment and objective-fact contrast audit"

[parameters.config]
type = "path"
default = "configs/mvp_short_subject_vm_stage3c25_winner_basin_audit.json"
description = "Frozen ten-node Stage-3C-23 source configuration."

[parameters.seeds]
type = "csv-int"
default = "12301,12302,12303,12304,12305,12306,12307,12308,12309"
description = "Frozen nine independent-source panel."

[parameters.analysis_root]
type = "path"
default = "analyses/d1z_subject_vm_stage3c31_alignment_ablation_v1/final"
description = "Rank-one/rank-two arms and Stage-3C-23 through Stage-3C-31 assessments."

[parameters.output]
type = "result-path"
default = "d1z_subject_vm_stage3c31_alignment_ablation_v1_results.zip"
description = "Compact declared-evidence result bundle separate from the project archive."

[steps.run-rank1]
description = "Run the common dual-readout graph with duplicated uncertainty coordinates."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "2", "--horizon-ticks", "8", "--bootstrap-subjects", "16", "--rollback-after-ticks", "3", "--bootstrap-target-family", "edge_forward_gate", "--bootstrap-edge-carrier-enabled", "--bootstrap-readout-input-port", "11", "--bootstrap-second-readout-input-port", "11", "--association-tie-break", "latest", "--association-candidate-limit", "1", "--backend", "cpu", "--output", "{analysis_root}/rank1", "--overwrite"]

[steps.run-rank2]
description = "Change only node-9 input to the frozen screened port 7 rank-two coordinate."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "2", "--horizon-ticks", "8", "--bootstrap-subjects", "16", "--rollback-after-ticks", "3", "--bootstrap-target-family", "edge_forward_gate", "--bootstrap-edge-carrier-enabled", "--bootstrap-readout-input-port", "11", "--bootstrap-second-readout-input-port", "7", "--association-tie-break", "latest", "--association-candidate-limit", "1", "--backend", "cpu", "--output", "{analysis_root}/rank2", "--overwrite"]

[steps.assess-stage3c23]
description = "Re-establish isolated rank-two reachability and lineage."
command = ["se-subject-vm-stage3c23-dual-readout-rank", "--rank1-study-report", "{analysis_root}/rank1/study_report.json", "--rank1-component", "{analysis_root}/rank1/component_reproducibility.json", "--rank1-diagnostics", "{analysis_root}/rank1/stage3c10_diagnostics.json", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--output", "{analysis_root}/stage3c23_dual_readout_rank.json"]

[steps.assess-stage3c24]
description = "Re-establish candidate opportunity, score margin, identity coverage and reuse concentration."
command = ["se-subject-vm-stage3c24-rank2-selection", "--rank1-study-report", "{analysis_root}/rank1/study_report.json", "--rank1-component", "{analysis_root}/rank1/component_reproducibility.json", "--rank1-diagnostics", "{analysis_root}/rank1/stage3c10_diagnostics.json", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c23-assessment", "{analysis_root}/stage3c23_dual_readout_rank.json", "--output", "{analysis_root}/stage3c24_rank2_selection.json"]

[steps.assess-stage3c25]
description = "Re-establish numerical margin, candidate opportunity and deterministic winner-basin reuse."
command = ["se-subject-vm-stage3c25-winner-basin", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c24-assessment", "{analysis_root}/stage3c24_rank2_selection.json", "--output", "{analysis_root}/stage3c25_winner_basin.json"]

[steps.assess-stage3c26]
description = "Separate source-boundary forcing, historical age, query phase and opportunity-normalized winner occupancy."
command = ["se-subject-vm-stage3c26-age-phase-opportunity", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c25-assessment", "{analysis_root}/stage3c25_winner_basin.json", "--output", "{analysis_root}/stage3c26_age_phase_opportunity.json"]

[steps.assess-stage3c27]
description = "Separate source-boundary forcing, exact latest ties and strict local token-geometry wins."
command = ["se-subject-vm-stage3c27-token-kinematics", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c26-assessment", "{analysis_root}/stage3c26_age_phase_opportunity.json", "--output", "{analysis_root}/stage3c27_token_kinematics.json"]

[steps.assess-stage3c28]
description = "Separate a shared discrete first-coordinate codebook, cross-subject transition synchrony and subject-anchored recurrent winner basins."
command = ["se-subject-vm-stage3c28-recurrent-basin", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c27-assessment", "{analysis_root}/stage3c27_token_kinematics.json", "--output", "{analysis_root}/stage3c28_recurrent_basin.json"]

[steps.assess-stage3c29]
description = "Condition exact first-state transition replay and subject-anchored second-coordinate locality on multi-candidate opportunity."
command = ["se-subject-vm-stage3c29-transition-occupancy", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c28-assessment", "{analysis_root}/stage3c28_recurrent_basin.json", "--output", "{analysis_root}/stage3c29_transition_occupancy.json"]

[steps.assess-stage3c30]
description = "Ablate the second coordinate to zero and scan bounded positive weights over the identical authoritative candidate set."
command = ["se-subject-vm-stage3c30-weight-robustness", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c29-assessment", "{analysis_root}/stage3c29_transition_occupancy.json", "--output", "{analysis_root}/stage3c30_weight_robustness.json"]


[steps.assess-stage3c31]
description = "Break subject-time alignment while preserving the exact tickwise second-coordinate marginal, then compare component-wise objective-fact contrasts."
command = ["se-subject-vm-stage3c31-alignment-ablation", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c30-assessment", "{analysis_root}/stage3c30_weight_robustness.json", "--output", "{analysis_root}/stage3c31_alignment_ablation.json"]

[steps.pack-results]
description = "Package declared Stage-3C-23 through Stage-3C-31 evidence without checkpoints or run directories."
requires_json = [
  { path = "{analysis_root}/rank1/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/rank2/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/stage3c27_token_kinematics.json", field = "cross_source_findings.strict_geometry_accounts_for_at_least_99_percent_of_multi_candidate_age_one_selections", equals = true },
  { path = "{analysis_root}/stage3c27_token_kinematics.json", field = "cross_source_findings.exact_latest_tie_break_contributes_less_than_one_percent_of_multi_candidate_queries", equals = true },
  { path = "{analysis_root}/stage3c27_token_kinematics.json", field = "diagnostic_interpretation.latest_tie_break_is_the_primary_age_one_basin_driver", equals = false },
  { path = "{analysis_root}/stage3c28_recurrent_basin.json", field = "cross_source_findings.second_coordinate_is_subject_anchored_in_all_sources", equals = true },
  { path = "{analysis_root}/stage3c28_recurrent_basin.json", field = "cross_source_findings.same_state_winner_is_nearest_second_coordinate_within_that_state_in_all_sources", equals = true },
  { path = "{analysis_root}/stage3c28_recurrent_basin.json", field = "diagnostic_interpretation.cross_subject_phase_synchrony_is_supported", equals = false },
  { path = "{analysis_root}/stage3c29_transition_occupancy.json", field = "cross_source_findings.exact_transition_class_replay_is_consistently_enriched_in_all_sources", equals = false },
  { path = "{analysis_root}/stage3c29_transition_occupancy.json", field = "cross_source_findings.nearest_second_coordinate_within_state_has_higher_opportunity_conditioned_selection_rate_in_all_sources", equals = true },
  { path = "{analysis_root}/stage3c29_transition_occupancy.json", field = "diagnostic_interpretation.subject_anchored_second_coordinate_locality_remains_predictive_after_opportunity_conditioning", equals = true },
  { path = "{analysis_root}/stage3c30_weight_robustness.json", field = "cross_source_findings.rank_collapse_changes_selected_identity_in_all_sources", equals = true },
  { path = "{analysis_root}/stage3c30_weight_robustness.json", field = "cross_source_findings.every_positive_weight_preserves_nearest_second_coordinate_ordering_in_all_sources", equals = true },
  { path = "{analysis_root}/stage3c30_weight_robustness.json", field = "diagnostic_interpretation.exact_positive_second_coordinate_weight_is_fine_tuned", equals = false },
  { path = "{analysis_root}/stage3c31_alignment_ablation.json", field = "cross_source_findings.tickwise_second_coordinate_marginal_is_preserved_in_all_sources", equals = true },
  { path = "{analysis_root}/stage3c31_alignment_ablation.json", field = "cross_source_findings.candidate_evaluation_count_is_matched_in_all_sources", equals = true },
  { path = "{analysis_root}/stage3c31_alignment_ablation.json", field = "permanent_parameter_retention_authorized", equals = false },
  { path = "{analysis_root}/stage3c27_token_kinematics.json", field = "permanent_parameter_retention_authorized", equals = false }
]
command = ["python", "scripts/package_required_results.py", "--study-root", "{study_dir}", "--required-file", "{analysis_root}/rank1/study_report.json", "--required-file", "{analysis_root}/rank1/bootstrap_profile.json", "--required-file", "{analysis_root}/rank1/paired_evidence_assessment.json", "--required-file", "{analysis_root}/rank1/component_reproducibility.json", "--required-file", "{analysis_root}/rank1/stage3c10_diagnostics.json", "--required-file", "{analysis_root}/rank2/study_report.json", "--required-file", "{analysis_root}/rank2/bootstrap_profile.json", "--required-file", "{analysis_root}/rank2/paired_evidence_assessment.json", "--required-file", "{analysis_root}/rank2/component_reproducibility.json", "--required-file", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--required-file", "{analysis_root}/stage3c23_dual_readout_rank.json", "--required-file", "{analysis_root}/stage3c24_rank2_selection.json", "--required-file", "{analysis_root}/stage3c25_winner_basin.json", "--required-file", "{analysis_root}/stage3c26_age_phase_opportunity.json", "--required-file", "{analysis_root}/stage3c27_token_kinematics.json", "--required-file", "{analysis_root}/stage3c28_recurrent_basin.json", "--required-file", "{analysis_root}/stage3c29_transition_occupancy.json", "--required-file", "{analysis_root}/stage3c30_weight_robustness.json", "--required-file", "{analysis_root}/stage3c31_alignment_ablation.json", "--output", "{output}"]
