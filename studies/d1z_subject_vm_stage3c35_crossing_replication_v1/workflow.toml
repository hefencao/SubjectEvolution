schema = "se-study-workflow-v1"
study_id = "d1z_subject_vm_stage3c35_crossing_replication_v1"
title = "D1-Z Subject VM Stage 3C-35 disjoint-source crossing-taxonomy replication"

[parameters.config]
type = "path"
default = "configs/mvp_short_subject_vm_stage3c25_winner_basin_audit.json"
description = "Frozen ten-node Stage-3C-23 source configuration."

[parameters.seeds]
type = "csv-int"
default = "12401,12402,12403,12404,12405,12406,12407,12408,12409"
description = "Preregistered disjoint nine-source replication panel."

[parameters.reference_stage3c27_assessment]
type = "path"
default = "analyses/d1z_subject_vm_stage3c33_exposure_propagation_v1/final/stage3c27_token_kinematics.json"
description = "Frozen original-panel Stage-3C-27 qualification assessment."

[parameters.analysis_root]
type = "path"
default = "analyses/d1z_subject_vm_stage3c35_crossing_replication_v1/final"
description = "Disjoint rank-one/rank-two source arms and Stage-3C-23 through Stage-3C-27 qualification chain."

[parameters.output]
type = "result-path"
default = "d1z_subject_vm_stage3c35_crossing_replication_v1_results.zip"
description = "Compact disjoint-source replication evidence bundle separate from the project archive."

[steps.run-rank1]
description = "Run the common dual-readout graph with duplicated uncertainty coordinates."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "2", "--horizon-ticks", "8", "--bootstrap-subjects", "16", "--rollback-after-ticks", "3", "--bootstrap-target-family", "edge_forward_gate", "--bootstrap-edge-carrier-enabled", "--bootstrap-readout-input-port", "11", "--bootstrap-second-readout-input-port", "11", "--association-tie-break", "latest", "--association-candidate-limit", "1", "--backend", "cpu", "--output", "{analysis_root}/rank1", "--overwrite"]

[steps.run-rank2]
description = "Change only node-9 input to the frozen screened port 7 rank-two coordinate."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "2", "--horizon-ticks", "8", "--bootstrap-subjects", "16", "--rollback-after-ticks", "3", "--bootstrap-target-family", "edge_forward_gate", "--bootstrap-edge-carrier-enabled", "--bootstrap-readout-input-port", "11", "--bootstrap-second-readout-input-port", "7", "--association-tie-break", "latest", "--association-candidate-limit", "1", "--backend", "cpu", "--output", "{analysis_root}/rank2", "--overwrite"]

[steps.assess-stage3c23]
description = "Re-establish isolated rank-two reachability and lineage."
command = ["se-subject-vm-stage3c23-dual-readout-rank", "--rank1-study-report", "{analysis_root}/rank1/study_report.json", "--rank1-component", "{analysis_root}/rank1/component_reproducibility.json", "--rank1-diagnostics", "{analysis_root}/rank1/stage3c10_diagnostics.json", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--output", "{analysis_root}/stage3c23_dual_readout_rank.json"]

[steps.assess-stage3c24]
description = "Re-establish candidate opportunity, score margin, identity coverage and reuse concentration."
command = ["se-subject-vm-stage3c24-rank2-selection", "--rank1-study-report", "{analysis_root}/rank1/study_report.json", "--rank1-component", "{analysis_root}/rank1/component_reproducibility.json", "--rank1-diagnostics", "{analysis_root}/rank1/stage3c10_diagnostics.json", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c23-assessment", "{analysis_root}/stage3c23_dual_readout_rank.json", "--output", "{analysis_root}/stage3c24_rank2_selection.json"]

[steps.assess-stage3c25]
description = "Re-establish numerical margin, candidate opportunity and deterministic winner-basin reuse."
command = ["se-subject-vm-stage3c25-winner-basin", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c24-assessment", "{analysis_root}/stage3c24_rank2_selection.json", "--output", "{analysis_root}/stage3c25_winner_basin.json"]

[steps.assess-stage3c26]
description = "Separate source-boundary forcing, historical age, query phase and opportunity-normalized winner occupancy."
command = ["se-subject-vm-stage3c26-age-phase-opportunity", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c25-assessment", "{analysis_root}/stage3c25_winner_basin.json", "--output", "{analysis_root}/stage3c26_age_phase_opportunity.json"]

[steps.assess-stage3c27]
description = "Separate source-boundary forcing, exact latest ties and strict local token-geometry wins."
command = ["se-subject-vm-stage3c27-token-kinematics", "--rank2-study-report", "{analysis_root}/rank2/study_report.json", "--rank2-component", "{analysis_root}/rank2/component_reproducibility.json", "--rank2-diagnostics", "{analysis_root}/rank2/stage3c10_diagnostics.json", "--stage3c26-assessment", "{analysis_root}/stage3c26_age_phase_opportunity.json", "--output", "{analysis_root}/stage3c27_token_kinematics.json"]

[steps.assess-stage3c35]
description = "Freeze the preregistered stop when the disjoint panel fails the Stage-3C-27 prerequisite required by Stage 3C-28."
command = ["se-subject-vm-stage3c35-crossing-replication", "--reference-stage3c34-decision", "protocols/decisions/subject_graph_vm_stage3c34_threshold_crossing_v1.json", "--reference-stage3c27-assessment", "{reference_stage3c27_assessment}", "--stage3c27-assessment", "{analysis_root}/stage3c27_token_kinematics.json", "--output", "{analysis_root}/stage3c35_crossing_replication.json", "--summary-output", "{analysis_root}/stage3c35_study_summary.json", "--diagnostic-report", "{analysis_root}/stage3c35_diagnostic_report.md"]

[steps.pack-results]
description = "Package the disjoint source qualification chain and frozen stop evidence."
requires_json = [
  { path = "{analysis_root}/rank1/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/rank2/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/stage3c35_crossing_replication.json", field = "source_panels_are_disjoint", equals = true },
  { path = "{analysis_root}/stage3c35_crossing_replication.json", field = "qualification.stage3c28_gate_passed", equals = false },
  { path = "{analysis_root}/stage3c35_crossing_replication.json", field = "prediction_assessment.crossing_prediction_tested", equals = false },
  { path = "{analysis_root}/stage3c35_crossing_replication.json", field = "permanent_parameter_retention_authorized", equals = false }
]
command = ["python", "scripts/package_required_results.py", "--study-root", "{study_dir}", "--required-file", "{analysis_root}/rank1/study_report.json", "--required-file", "{analysis_root}/rank1/component_reproducibility.json", "--required-file", "{analysis_root}/rank2/study_report.json", "--required-file", "{analysis_root}/rank2/component_reproducibility.json", "--required-file", "{analysis_root}/stage3c23_dual_readout_rank.json", "--required-file", "{analysis_root}/stage3c24_rank2_selection.json", "--required-file", "{analysis_root}/stage3c25_winner_basin.json", "--required-file", "{analysis_root}/stage3c26_age_phase_opportunity.json", "--required-file", "{reference_stage3c27_assessment}", "--required-file", "{analysis_root}/stage3c27_token_kinematics.json", "--required-file", "{analysis_root}/stage3c35_crossing_replication.json", "--required-file", "{analysis_root}/stage3c35_study_summary.json", "--required-file", "{analysis_root}/stage3c35_diagnostic_report.md", "--required-file", "protocols/decisions/subject_graph_vm_stage3c35_crossing_replication_v1.json", "--output", "{output}"]
