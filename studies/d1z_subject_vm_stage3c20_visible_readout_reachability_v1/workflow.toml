schema = "se-study-workflow-v1"
study_id = "d1z_subject_vm_stage3c20_visible_readout_reachability_v1"
title = "D1-Z Subject VM Stage 3C-20 visible graph-state readout reachability audit"

[parameters.config]
type = "path"
default = "configs/mvp_short_subject_vm_stage3c8_paired_study.json"
description = "Unchanged fixed-bootstrap paired source configuration."

[parameters.seeds]
type = "csv-int"
default = "12301,12302,12303,12304,12305,12306,12307,12308,12309"
description = "Frozen nine independent-source panel."

[parameters.analysis_root]
type = "path"
default = "analyses/d1z_subject_vm_stage3c20_visible_readout_reachability_v1/final"
description = "Baseline/readout arms plus Stage-3C-20 assessment."

[parameters.output]
type = "result-path"
default = "d1z_subject_vm_stage3c20_visible_readout_reachability_v1_results.zip"
description = "Compact research result bundle separate from the project archive."

[steps.run-baseline]
description = "Run the frozen reachable baseline with no association-visible node-0 state readout."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "2", "--horizon-ticks", "8", "--bootstrap-subjects", "16", "--rollback-after-ticks", "3", "--bootstrap-target-family", "edge_forward_gate", "--bootstrap-edge-carrier-enabled", "--association-tie-break", "latest", "--association-candidate-limit", "1", "--backend", "cpu", "--output", "{analysis_root}/baseline", "--overwrite"]

[steps.run-readout]
description = "Run the same panel with only node-0 state emitted to visible token port 29."
command = ["se-subject-vm-short-paired-study", "--config", "{config}", "--seeds", "{seeds}", "--source-ticks", "2", "--horizon-ticks", "8", "--bootstrap-subjects", "16", "--rollback-after-ticks", "3", "--bootstrap-target-family", "edge_forward_gate", "--bootstrap-edge-carrier-enabled", "--bootstrap-node0-visible-readout-enabled", "--association-tie-break", "latest", "--association-candidate-limit", "1", "--backend", "cpu", "--output", "{analysis_root}/readout", "--overwrite"]

[steps.assess-readout]
description = "Verify isolation and audit visible geometry, score separability and paired evidence."
command = ["se-subject-vm-stage3c20-readout-reachability", "--baseline-study-report", "{analysis_root}/baseline/study_report.json", "--baseline-component", "{analysis_root}/baseline/component_reproducibility.json", "--baseline-diagnostics", "{analysis_root}/baseline/stage3c10_diagnostics.json", "--readout-study-report", "{analysis_root}/readout/study_report.json", "--readout-component", "{analysis_root}/readout/component_reproducibility.json", "--readout-diagnostics", "{analysis_root}/readout/stage3c10_diagnostics.json", "--output", "{analysis_root}/stage3c20_readout_reachability.json"]

[steps.pack-results]
description = "Package both evidence arms and the Stage-3C-20 assessment without checkpoints."
requires_json = [
  { path = "{analysis_root}/baseline/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/readout/study_report.json", field = "engineering_summary.stage3c7_engineering_screen_passed", equals = true },
  { path = "{analysis_root}/stage3c20_readout_reachability.json", field = "isolation_contract.bootstrap_profiles_differ_only_in_node0_visible_readout", equals = true },
  { path = "{analysis_root}/stage3c20_readout_reachability.json", field = "diagnostic_interpretation.readout_creates_association_visible_centered_variance", equals = true },
  { path = "{analysis_root}/stage3c20_readout_reachability.json", field = "diagnostic_interpretation.current_readout_is_shared_temporal_phase_not_event_identity", equals = true },
  { path = "{analysis_root}/stage3c20_readout_reachability.json", field = "permanent_parameter_retention_authorized", equals = false },
]
command = ["python", "scripts/package_required_results.py", "--study-root", "{study_dir}", "--required-file", "{analysis_root}/baseline/study_report.json", "--required-file", "{analysis_root}/baseline/bootstrap_profile.json", "--required-file", "{analysis_root}/baseline/paired_evidence_assessment.json", "--required-file", "{analysis_root}/baseline/component_reproducibility.json", "--required-file", "{analysis_root}/baseline/stage3c10_diagnostics.json", "--required-file", "{analysis_root}/readout/study_report.json", "--required-file", "{analysis_root}/readout/bootstrap_profile.json", "--required-file", "{analysis_root}/readout/paired_evidence_assessment.json", "--required-file", "{analysis_root}/readout/component_reproducibility.json", "--required-file", "{analysis_root}/readout/stage3c10_diagnostics.json", "--required-file", "{analysis_root}/stage3c20_readout_reachability.json", "--output", "{output}"]
